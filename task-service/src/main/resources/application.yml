server:
  port: 8080

spring:
  application:
    name: task-service

  datasource:
    url: jdbc:postgresql://localhost:5432/lab1_db
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: lab1-app
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile

        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/lab1
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/lab1